  <div class="card">
    <div class="ctitle"><i class="ti ti-users"></i>반 · 학생 선택
      <button onclick="openClassManage()" style="margin-left:auto;background:#eef3f9;border:1px solid #d4e0ee;color:#1e3a5f;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer"><i class="ti ti-settings"></i> 반 관리</button>
    </div>

    <div style="margin-top:12px"><label>학생 선택 <span style="color:#aaa;font-weight:400">(클릭 시 단어 기록 표시)</span></label>
      <div class="stu-chip-area" id="stuChipArea"></div>
    </div>
  </div>

  <div id="vocabPanel" style="display:none">
    <div class="vtabs" id="vtabs">
      <div class="vtab on" data-tab="regular" onclick="switchTab('regular')"><i class="ti ti-book"></i>정규 Daily Vocab</div>
      <div class="vtab" data-tab="external" onclick="switchTab('external')" id="extTab" style="display:none"><i class="ti ti-vocabulary"></i>외부교재 (능률보카/워드맥스)</div>
    </div>

    <!-- 정규 탭 -->
    <div id="tab_regular">
      <div class="card">
        <div class="ctitle"><i class="ti ti-chart-line"></i><span id="regWho">정규 단어 누적 현황</span></div>
        <div class="vsum" id="regSummary"></div>
        <div class="trend" id="regTrend"></div>
        <div class="hint"><i class="ti ti-info-circle"></i>막대는 회차별 정답률입니다. 빈칸은 미응시로 평균에서 제외됩니다.</div>
      </div>
      <div class="card">
        <div class="ctitle"><i class="ti ti-pencil"></i>회차별 점수 입력 <span style="font-weight:600;color:#aab;text-transform:none;letter-spacing:0;margin-left:4px" id="regPerLabel"></span></div>
        <div id="regGridWrap"></div>
      </div>
    </div>

    <!-- 외부교재 탭 -->
    <div id="tab_external" style="display:none">
      <div class="card">
        <div class="ctitle"><i class="ti ti-chart-line"></i><span id="extWho">외부교재 단어 누적 현황</span></div>
        <div class="vsum" id="extSummary"></div>
        <div class="trend" id="extTrend"></div>
        <div class="hint"><i class="ti ti-info-circle"></i>능률보카/워드맥스 등 외부교재 단어 시험. 통과컷 미달 시 재시험 점수를 함께 기록합니다.</div>
      </div>
      <div class="card">
        <div class="ctitle"><i class="ti ti-pencil"></i>외부교재 점수 입력 <span style="font-weight:600;color:#aab;text-transform:none;letter-spacing:0;margin-left:4px">날짜별 · 점수/만점/통과컷</span></div>
        <div class="extbox">
          <div class="exthd"><i class="ti ti-vocabulary"></i>오늘 외부교재 단어시험</div>
          <div class="row" style="margin-bottom:9px"><div style="max-width:180px"><label>시험 날짜</label><input type="date" id="extDate"></div>
            <div style="max-width:200px"><label>교재명 (선택)</label><input type="text" id="extBook" placeholder="예: 능률보카 / 워드맥스"></div></div>
          <div class="scoreIn"><input type="number" id="ext_raw" min="0" placeholder="점수" oninput="extJudge()"><span class="slash">/</span><input type="number" id="ext_max" min="1" placeholder="만점" value="40" oninput="extJudge()"><span style="font-size:11px;color:#889">점</span>
            <span class="cutwrap">통과 최하점 <input type="number" id="ext_cut" min="0" placeholder="예:36" oninput="extJudge()"><span style="font-size:11px;color:#889">점</span></span></div>
          <div class="passrow" id="ext_passrow"></div>
          <div class="retakerow" id="ext_retakerow" style="display:none"><span style="font-size:11px;color:#c0392b;font-weight:600">재시험 후 점수</span> <input type="number" id="ext_retake" min="0" placeholder="재시험 점수" oninput="extJudge()"><span style="font-size:11px;color:#889">/ <span id="ext_retakemax">40</span>점</span></div>

        </div>
      </div>
    </div>
  </div>

const SEED_VERSION='pamus-2026-07-01';
const LS={get(k){try{const v=localStorage.getItem(k);return v?{value:v}:null;}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},remove(k){try{localStorage.removeItem(k);}catch(e){}}};
function g(id){return document.getElementById(id);}
function val(id){const e=g(id);return e?e.value:'';}
let roster={students:{},classes:[]};
function _rosterGet(key){const r=LS.get('pamus:'+key);if(!r)return null;try{return JSON.parse(r.value);}catch(e){return null;}}
function _rosterSet(key,val){LS.set('pamus:'+key,JSON.stringify(val));}
function loadRoster(){
  const r=_rosterGet('roster');
  const ver=_rosterGet('rosterSeedVer');
  if(r&&r.students&&Object.keys(r.students).length>0){
    roster=r;
    if(ver!==SEED_VERSION){ mergeSeedUpdate(); _rosterSet('roster',roster); _rosterSet('rosterSeedVer',SEED_VERSION); }
  }else{
    roster=JSON.parse(JSON.stringify(ROSTER_SEED));
    _rosterSet('roster',roster); _rosterSet('rosterSeedVer',SEED_VERSION);
    _rosterSet('prevSeedIds',Object.keys(ROSTER_SEED.students));
  }
}
function mergeSeedUpdate(){
  const seed=ROSTER_SEED.students, cur=roster.students;
  // 시드에 있는 학생: 이름·반배정(currentClass)·이력을 시드 기준으로 갱신 (명단 재편 반영)
  Object.keys(seed).forEach(id=>{
    if(cur[id]){
      cur[id].name=seed[id].name;
      cur[id].currentClass=seed[id].currentClass;
      cur[id].classHistory=JSON.parse(JSON.stringify(seed[id].classHistory||[]));
      if(seed[id].school)cur[id].school=seed[id].school;
    } else {
      cur[id]=JSON.parse(JSON.stringify(seed[id]));
    }
  });
  // 직전 시드에 있었으나 이번 시드에서 빠진 학생 제거 (퇴원·승급)
  const prev=new Set(_rosterGet('prevSeedIds')||[]);
  Object.keys(cur).forEach(id=>{ if(!seed[id]&&prev.has(id)) delete cur[id]; });
  // 반 목록: 시드 반 + 사용자가 직접 추가해 학생이 있는 반만 보존
  const seedClasses=(ROSTER_SEED.classes||[]);
  const userClasses=(roster.classes||[]).filter(c=>!seedClasses.includes(c) && Object.values(cur).some(s=>s.currentClass===c));
  roster.classes=[...seedClasses, ...userClasses];
  _rosterSet('prevSeedIds',Object.keys(seed));
}
function saveRoster(){_rosterSet('roster',roster);}
function classList(){
  const set=new Set(roster.classes||[]);
  Object.values(roster.students).forEach(s=>{if(s.currentClass)set.add(s.currentClass);});
  return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
}
function studentsInClass(cls){
  return Object.values(roster.students).filter(s=>s.currentClass===cls&&s.status!=='inactive').sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
function escR(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function deleteClass(cls){

function renameClass(input){
  const orig=input.getAttribute('data-orig'), next=(input.value||'').trim();
  if(!next){alert('반 이름은 비울 수 없습니다.');input.value=orig;return;}
  if(next===orig)return;
  if(classList().includes(next)){alert('이미 존재하는 반 이름입니다.');input.value=orig;return;}
  if(!roster.classes)roster.classes=[];
  roster.classes=roster.classes.map(c=>c===orig?next:c);
  if(!roster.classes.includes(next))roster.classes.push(next);
  Object.values(roster.students).forEach(st=>{
    if(st.currentClass===orig)st.currentClass=next;
    if(Array.isArray(st.classHistory))st.classHistory.forEach(h=>{if(h&&h.class===orig)h.class=next;});
  });
  saveRoster(); renderClassManageList(); renderClassSelect();
  if(g('classSelect').value===orig)g('classSelect').value=next;
  if(g('sClass')&&g('sClass').value===orig)g('sClass').value=next;
  renderStuChips();
}

function closeStuEdit(){const m=g('stuEditModal');if(m)m.classList.remove('on');}
function saveStuEdit(){
  const mode=g('seMode').value, id=g('seId').value;
  const name=(g('seName').value||'').trim(), school=(g('seSchool').value||'').trim();
  const sid=(g('seSid').value||'').trim(), cls=g('seClass').value;
  if(!name){alert('학생 이름을 입력하세요.');return;}
  if(!sid){alert('학번을 입력하세요.');return;}
  if(mode==='add'){
    if(roster.students[sid]){
      const ex=roster.students[sid];
      if(!confirm(`학번 ${sid}는 이미 등록된 학생(${ex.name})입니다.
이 학생을 '${cls}' 반으로 이동할까요?`)){return;}
      ex.name=name||ex.name; ex.school=school||ex.school;
      if(ex.status==='inactive'){ex.status='active';delete ex.suspendedAt;}
      if(ex.currentClass!==cls){ex.currentClass=cls;(ex.classHistory=ex.classHistory||[]).push({class:cls,from:new Date().toISOString().slice(0,10)});}
      saveRoster(); closeStuEdit(); renderClassSelect(); renderStuChips(); renderClassManageList(); return;
    }
    roster.students[sid]={id:sid,name,school,currentClass:cls,classHistory:cls?[{class:cls,from:new Date().toISOString().slice(0,10)}]:[],teacher:'',status:'active'};
  }else{

    st.name=name; st.school=school;
    if(st.currentClass!==cls){ st.currentClass=cls; (st.classHistory=st.classHistory||[]).push({class:cls,from:new Date().toISOString().slice(0,10)}); }
  }
  saveRoster(); closeStuEdit(); renderClassSelect(); renderStuChips(); renderClassManageList();
}
function suspendStudent(id){
  const st=roster.students[id]; if(!st)return;
  if(!confirm(`'${st.name}' 학생을 휴원 처리할까요?\n명단에서 숨겨지지만 점수·이력은 보관되며, 보관함에서 복귀할 수 있습니다.`))return;

function restoreStudent(id){

function withdrawStudent(id){
  const st=roster.students[id]; if(!st)return;
  if(!confirm(`'${st.name}' 학생을 퇴원(완전 삭제) 처리할까요?\n이 학생의 점수·리포트 이력도 함께 삭제되며 복구할 수 없습니다.`))return;
  if(!confirm(`정말 삭제하시겠습니까? 되돌릴 수 없습니다.`))return;

  const pre=_stuHistKey(st);

/* ===== 정규 Daily Vocab ===== */
// 회차 정의: days 모드 → [1..count], lessons 모드 → Reading 1~6 + Listening 1~6
function regSlots(){
  if(CFG.regular.mode==='days'){
    return Array.from({length:CFG.regular.count},(_,i)=>({key:'D'+(i+1),label:'Day '+(i+1),group:null}));
  }else{
    const r=Array.from({length:6},(_,i)=>({key:'R'+(i+1),label:'R-Lesson '+(i+1),group:'Reading'}));
    const l=Array.from({length:6},(_,i)=>({key:'L'+(i+1),label:'L-Lesson '+(i+1),group:'Listening'}));
    return r.concat(l);
  }
}
function regGet(id){return _rosterGet('vreg_'+LEVEL+'_'+id)||{};}
function regSet(id,d){_rosterSet('vreg_'+LEVEL+'_'+id,d);}
function extGet(id){return _rosterGet('vext_'+LEVEL+'_'+id)||[];}
function extSet(id,a){_rosterSet('vext_'+LEVEL+'_'+id,a);}

function selectStudent(id){curStuId=id;renderStuChips();renderVocab(id);}
let curTab='regular';
function switchTab(t){curTab=t;g('tab_regular').style.display=(t==='regular')?'block':'none';g('tab_external').style.display=(t==='external')?'block':'none';document.querySelectorAll('.vtab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));}

function renderVocab(id){
  const st=roster.students[id];if(!st){g('vocabPanel').style.display='none';return;}
  g('vocabPanel').style.display='block';
  // 외부교재 탭 표시 여부
  g('extTab').style.display=CFG.external?'block':'none';
  if(!CFG.external&&curTab==='external')switchTab('regular');
  g('regWho').textContent=st.name+' — 정규 단어 누적';
  g('regPerLabel').textContent='회당 '+CFG.regular.perTest+'단어';
  renderRegular(id);
  if(CFG.external){g('extWho').textContent=st.name+' — 외부교재 단어 누적';renderExternal(id);g('extDate').value=new Date().toISOString().slice(0,10);
    var _ea=extGet(id);var _lb=_ea.length?(_ea[_ea.length-1].book||''):'';if(g('extBook'))g('extBook').value=_lb;}
}

function renderRegular(id){
  const data=regGet(id);const slots=regSlots();const per=CFG.regular.perTest;
  // 그리드 (lessons 모드는 그룹 헤더)
  let wrap='';
  if(CFG.regular.mode==='lessons'){
    ['Reading','Listening'].forEach(grp=>{
      wrap+='<div class="vgroup-label"><i class="ti ti-'+(grp==='Reading'?'book-2':'headphones')+'"></i>'+grp+' (6 lessons)</div><div class="vgrid">';
      slots.filter(s=>s.group===grp).forEach(s=>{wrap+=cellHTML(id,s,data,per);});
      wrap+='</div>';
    });
  }else{
    wrap+='<div class="vgrid">';
    slots.forEach(s=>{wrap+=cellHTML(id,s,data,per);});
    wrap+='</div>';
  }
  g('regGridWrap').innerHTML=wrap;
  renderRegSummary(id,data,slots,per);
}
function cellHTML(id,s,data,per){
  const v=data[s.key];const has=(v!=null&&v!=='');const pct=has?Math.round(v/per*100):null;
  return '<div class="vday'+(has?' done':'')+'"><div class="vday-h"><span class="vday-n">'+s.label+'</span>'+(has?'<span class="vday-pct">'+pct+'%</span>':'')+'</div><div class="vday-in"><input type="number" min="0" max="'+per+'" value="'+(has?v:'')+'" onchange="onRegInput(\''+id+'\',\''+s.key+'\',this.value)" placeholder="–"><span class="max">/ '+per+'</span></div></div>';
}
function onRegInput(id,key,raw){
  const data=regGet(id);let v=(raw+'').trim();const per=CFG.regular.perTest;
  if(v===''){delete data[key];}else{let n=parseInt(v,10);if(isNaN(n)||n<0)n=0;if(n>per)n=per;data[key]=n;}
  regSet(id,data);setTimeout(function(){renderRegular(id);},0);
}
function renderRegSummary(id,data,slots,per){
  const taken=slots.filter(s=>data[s.key]!=null);
  const n=taken.length;let got=0,max=0;taken.forEach(s=>{got+=data[s.key];max+=per;});
  const avg=max?Math.round(got/max*100):0;
  g('regSummary').innerHTML='<div class="vstat"><div class="k">응시 회차</div><div class="v">'+n+'<small> / '+slots.length+'</small></div></div><div class="vstat"><div class="k">누적 정답</div><div class="v">'+got+'<small> / '+max+'</small></div></div><div class="vstat"><div class="k">누적 정답률</div><div class="v">'+avg+'<small>%</small></div></div>';
  let bars='';slots.forEach(s=>{const v=data[s.key];if(v==null){bars+='<div class="tbar-wrap"><div class="tbar" style="height:2px;background:#e0ddd5"></div><div class="tbar-lbl">'+s.label.replace(/[^0-9RL]/g,'')+'</div></div>';return;}const pct=Math.round(v/per*100);const cls=pct>=80?'high':pct>=60?'mid':'low';bars+='<div class="tbar-wrap"><div class="tbar '+cls+'" style="height:'+Math.max(pct*0.7,3)+'px" title="'+s.label+': '+v+'/'+per+' ('+pct+'%)"></div><div class="tbar-lbl">'+s.label.replace(/[^0-9RL]/g,'')+'</div></div>';});
  g('regTrend').innerHTML=bars;
}

/* ===== 외부교재 (Bridge-3 그룹2 방식) ===== */
function extJudge(){
  const raw=parseFloat(val('ext_raw')),max=parseFloat(val('ext_max')),cut=parseFloat(val('ext_cut'));
  const pr=g('ext_passrow'),rr=g('ext_retakerow'),rm=g('ext_retakemax');
  if(rm&&!isNaN(max))rm.textContent=max;
  if(isNaN(raw)||isNaN(max)||isNaN(cut)||max<=0){pr.innerHTML='';rr.style.display='none';return;}
  const passed=raw>=cut;
  if(passed){pr.innerHTML='<span class="badge pass"><i class="ti ti-circle-check"></i> 한 번에 통과</span>';rr.style.display='none';}
  else{pr.innerHTML='<span class="badge retake"><i class="ti ti-refresh"></i> 재시험 대상 (컷 '+cut+'점 미달)</span>';rr.style.display='flex';}
}
function extSave(){
  const id=curStuId;if(!id)return;
  const raw=parseFloat(val('ext_raw')),max=parseFloat(val('ext_max')),cut=parseFloat(val('ext_cut'));
  if(isNaN(raw)||isNaN(max)||max<=0){extMsg('점수와 만점을 입력하세요.',true);return;}
  const date=val('extDate')||new Date().toISOString().slice(0,10);
  const pct=Math.round(raw/max*1000)/10;
  const rec={date,book:val('extBook'),raw,max,pct};
  if(!isNaN(cut)){rec.cut=cut;rec.passed=raw>=cut;const rt=parseFloat(val('ext_retake'));rec.finalPct=isNaN(rt)?pct:Math.round(rt/max*1000)/10;}
  else rec.finalPct=pct;
  const arr=extGet(id);const ix=arr.findIndex(e=>e.date===date);
  if(ix>=0)arr[ix]=rec;else arr.push(rec);
  arr.sort((a,b)=>a.date<b.date?-1:1);extSet(id,arr);
  extMsg(date+' · '+raw+'/'+max+' 저장 완료.',false);
  ['ext_raw','ext_retake','ext_book'].forEach(x=>{if(g(x))g(x).value='';});g('ext_passrow').innerHTML='';g('ext_retakerow').style.display='none';
  renderExternal(id);
}
function extMsg(m,err){const e=g('extSaved');e.style.display='block';e.style.color=err?'#c0392b':'#2d7a4f';e.textContent=m;}
function renderExternal(id){
  const arr=extGet(id);
  if(!arr.length){g('extSummary').innerHTML='<div class="vstat" style="flex:1"><div class="k">기록</div><div class="v">0<small>회</small></div></div>';g('extTrend').innerHTML='<div style="color:#bbb;font-size:12px;padding:18px">아직 외부교재 기록이 없습니다.</div>';return;}
  const finals=arr.map(r=>r.finalPct!=null?r.finalPct:r.pct);
  const firsts=arr.map(r=>r.pct);
  const favg=Math.round(finals.reduce((a,b)=>a+b,0)/finals.length*10)/10;
  const wp=arr.filter(r=>r.passed!=null);const once=wp.filter(r=>r.passed).length;
  g('extSummary').innerHTML='<div class="vstat"><div class="k">시험 횟수</div><div class="v">'+arr.length+'<small>회</small></div></div><div class="vstat"><div class="k">최종 평균</div><div class="v">'+favg+'<small>%</small></div></div><div class="vstat"><div class="k">한번에 통과</div><div class="v">'+(wp.length?Math.round(once/wp.length*100):'–')+'<small>'+(wp.length?'%':'')+'</small></div></div>';
  let bars='';arr.slice(-16).forEach(r=>{const pct=r.finalPct!=null?r.finalPct:r.pct;const cls=pct>=80?'high':pct>=60?'mid':'low';const rt=(r.passed===false)?' ⟳':'';bars+='<div class="tbar-wrap"><div class="tbar '+cls+'" style="height:'+Math.max(pct*0.7,3)+'px" title="'+r.date+': '+r.raw+'/'+r.max+' ('+pct+'%)'+rt+'"></div><div class="tbar-lbl">'+r.date.slice(5)+'</div></div>';});
  g('extTrend').innerHTML=bars;
}

document.addEventListener('DOMContentLoaded',()=>{loadRoster();renderClassSelect();});
