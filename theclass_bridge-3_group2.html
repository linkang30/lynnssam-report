<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Class Bridge-3 — 수업 평가 입력 & 성장 리포트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#eef1f7;color:#1a2238;font-size:14px;line-height:1.6}
.app{max-width:760px;margin:0 auto;padding:16px}
.tool-header{background:linear-gradient(135deg,#16243e 0%,#22365a 55%,#3f5a85 100%);color:#fff;border-radius:14px;padding:16px 22px;margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 24px rgba(34,54,90,.35);position:relative;overflow:hidden}
.tool-header::after{content:"";position:absolute;top:-40px;right:-20px;width:160px;height:160px;background:radial-gradient(circle,rgba(120,160,230,.35),transparent 70%);pointer-events:none}
.tool-header h1{font-size:16px;font-weight:700;position:relative}
.tool-header p{font-size:11px;opacity:.8;margin-top:2px;position:relative}
.hbadge{background:rgba(255,255,255,.18);border-radius:7px;padding:4px 11px;font-size:11px;font-weight:700;margin-left:10px;position:relative}
.steps{display:flex;gap:5px;margin-bottom:14px}
.sbtn{flex:1;padding:8px 14px;border-radius:20px;border:1.5px solid #d2d8e6;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#8590ad;display:flex;align-items:center;justify-content:center;gap:5px;transition:.2s}
.sbtn.active{background:#22365a;color:#fff;border-color:#22365a;box-shadow:0 2px 12px rgba(34,54,90,.35)}
.card{background:#fff;border:1px solid #e4e8f1;border-radius:13px;padding:18px 22px;margin-bottom:12px;box-shadow:0 1px 6px rgba(30,40,80,.06)}
.ctitle{font-size:10.5px;font-weight:700;color:#8590ad;letter-spacing:.7px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.ctitle i{font-size:15px;color:#3f5a85}
label{display:block;font-size:11px;color:#667;margin-bottom:3px;font-weight:500}
input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid #cdd5e6;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:#1a2238;background:#fff;outline:none}
input:focus,select:focus{border-color:#3f5a85;box-shadow:0 0 0 2px rgba(63,90,133,.12)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hidden{display:none}
.btn{border:none;border-radius:9px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.bprim{background:#22365a;color:#fff}.bprim:hover{background:#172741}
.bsec{background:#fff;color:#556;border:1px solid #d2d8e6}.bsec:hover{background:#f1f3f9}
.bgrn{background:#2d7a4f;color:#fff}.bgrn:hover{background:#246040}
.navrow{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
/* 입력 항목 카드 */
.itembox{border:1px solid #e4e8f1;border-radius:11px;padding:14px 16px;margin-bottom:11px;background:#fafbff}
.itemhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.itemhd .nm{font-size:13px;font-weight:700;color:#22365a;display:flex;align-items:center;gap:6px}
.itemhd .nm i{font-size:16px;color:#3f5a85}
.itemhd .mini{display:flex;align-items:center;gap:8px;font-size:11px;color:#667}
.scoreIn{display:flex;align-items:center;gap:7px}
.scoreIn input{width:70px;text-align:center}
.scoreIn .slash{color:#aab;font-weight:700}
.scoreIn{flex-wrap:wrap}
.cutwrap{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#667;margin-left:8px;padding-left:10px;border-left:1px solid #e2e6f0}
.cutwrap input{width:58px;text-align:center}
.passrow{margin-top:8px;font-size:12px;font-weight:700;min-height:20px;display:flex;align-items:center;gap:6px}
.passrow .pass{color:#2d7a4f}
.passrow .retake{color:#c0392b}
.passrow .badge{border-radius:10px;padding:2px 10px;font-size:11px}
.passrow .badge.pass{background:#eaf6ee}
.passrow .badge.retake{background:#fdeaea}
.retakerow{margin-top:8px;display:flex;align-items:center;gap:7px;background:#fdf3f3;border:1px solid #f3d4d4;border-radius:8px;padding:7px 10px}
.retakerow input{width:80px;text-align:center;border-color:#e8b4b4}
.pctnow{font-size:12px;font-weight:800;color:#22365a;min-width:46px;text-align:right}
.trendtag{font-size:10px;font-weight:700;border-radius:10px;padding:2px 8px}
.trendtag.up{background:#eaf6ee;color:#2d7a4f}
.trendtag.down{background:#fdeaea;color:#c0392b}
.trendtag.flat{background:#eef2fb;color:#3f5a85}
/* 태도 체크리스트 */
.chklist{display:flex;flex-direction:column;gap:6px}
.chkrow{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;background:#fff;border:1px solid #e8ebf3}
.chkrow input[type=checkbox]{width:17px;height:17px;accent-color:#2d7a4f;cursor:pointer}
.chkrow .cname{flex:1;font-size:12.5px;color:#334}
.chkrow .del{background:none;border:none;color:#c0a0a0;cursor:pointer;font-size:15px;padding:2px 5px}
.chkrow .del:hover{color:#c0392b}
.addchk{display:flex;gap:7px;margin-top:7px}
.addchk input{flex:1}
.addchk button{background:#3f5a85;color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:12px;font-weight:700;cursor:pointer}
.attsum{font-size:12px;font-weight:800;color:#2d7a4f;margin-top:8px;text-align:right}
.savedmsg{font-size:12px;color:#2d7a4f;margin-top:6px;display:none}
/* 성장 리포트 */
.gchart{background:#fff;border:1px solid #e4e8f1;border-radius:11px;padding:14px 16px;margin-bottom:11px}
.gchart .gh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.gchart .gname{font-size:12.5px;font-weight:700;color:#334;display:flex;align-items:center;gap:6px}
.gchart .gstat{font-size:11px;color:#667}
.gchart .gstat b{color:#22365a}
.recordlist{font-size:10.5px;color:#99a;margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.recordlist .rc{background:#f3f5fa;border-radius:5px;padding:1px 7px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="app">
<div class="tool-header">
  <div>
    <h1>📊 Bridge-3 수업 평가 입력 & 성장 리포트</h1>
    <p>파머스국제어학원 광교브랜치 · 강사용 · 리딩단어 / 문법 / Daily Vocab / 태도</p>
  </div>
  <img id="appLogo" alt="PAMUS" style="height:30px;width:auto;margin-left:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))">
  <div class="hbadge">v0.1 · 그룹2</div>
</div>

<div class="steps">
  <button id="sb0" class="sbtn active" onclick="go(0)"><i class="ti ti-edit"></i>수업 평가 입력</button>
  <button id="sb1" class="sbtn" onclick="go(1)"><i class="ti ti-chart-line"></i>성장 리포트</button>
</div>

<!-- STEP 0: 입력 -->
<div id="s0">
  <div class="card">
    <div class="ctitle"><i class="ti ti-user"></i>학생 · 날짜</div>
    <div class="row3">
      <div><label>학생 이름</label><input type="text" id="stuName" placeholder="예: 민준" oninput="onStuChange()"></div>
      <div><label>학교</label><input type="text" id="stuSchool" placeholder="예: 광교중" oninput="onStuChange()"></div>
      <div><label>평가 날짜</label><input type="date" id="evalDate"></div>
    </div>
    <div id="stuHint" style="font-size:11px;color:#3f5a85;background:#eef2fb;border-radius:8px;padding:8px 12px;display:none"></div>
  </div>

  <div class="card">
    <div class="ctitle"><i class="ti ti-clipboard-check"></i>오늘 수업 평가</div>

    <div class="itembox">
      <div class="itemhd"><span class="nm"><i class="ti ti-book"></i>리딩 단어시험</span>
        <span class="mini"><span class="pctnow" id="pct_rvocab">–</span></span></div>
      <div class="scoreIn"><input type="number" id="raw_rvocab" min="0" placeholder="점수" oninput="calcPct('rvocab')"><span class="slash">/</span><input type="number" id="max_rvocab" min="1" placeholder="만점" value="30" oninput="calcPct('rvocab')"><span style="font-size:11px;color:#889">점</span>
        <span class="cutwrap">통과 최하점수 <input type="number" id="cut_rvocab" min="0" placeholder="예:38" oninput="calcPct('rvocab')"><span style="font-size:11px;color:#889">점</span></span></div>
      <div class="passrow" id="passrow_rvocab"></div>
      <div class="retakerow" id="retakerow_rvocab" style="display:none"><span style="font-size:11px;color:#c0392b;font-weight:600">재시험 후 점수</span> <input type="number" id="retake_rvocab" min="0" placeholder="재시험 점수" oninput="calcPct('rvocab')"><span style="font-size:11px;color:#889">/ <span id="retakemax_rvocab">30</span>점</span></div>
    </div>

    <div class="itembox">
      <div class="itemhd"><span class="nm"><i class="ti ti-pencil"></i>문법 Test</span>
        <span class="mini"><span class="pctnow" id="pct_grammar">–</span></span></div>
      <div class="scoreIn"><input type="number" id="raw_grammar" min="0" max="100" placeholder="점수" oninput="calcPct('grammar')"><span class="slash">/</span><span style="font-size:13px;color:#667">100</span><span style="font-size:11px;color:#889">점 (고정)</span></div>
    </div>

    <div class="itembox">
      <div class="itemhd"><span class="nm"><i class="ti ti-vocabulary"></i>Daily Vocab (능률보카/워드맥스)</span>
        <span class="mini"><span class="pctnow" id="pct_dvocab">–</span></span></div>
      <div class="scoreIn"><input type="number" id="raw_dvocab" min="0" placeholder="점수" oninput="calcPct('dvocab')"><span class="slash">/</span><input type="number" id="max_dvocab" min="1" placeholder="만점" value="40" oninput="calcPct('dvocab')"><span style="font-size:11px;color:#889">점</span>
        <span class="cutwrap">통과 최하점수 <input type="number" id="cut_dvocab" min="0" placeholder="예:38" oninput="calcPct('dvocab')"><span style="font-size:11px;color:#889">점</span></span></div>
      <div class="passrow" id="passrow_dvocab"></div>
      <div class="retakerow" id="retakerow_dvocab" style="display:none"><span style="font-size:11px;color:#c0392b;font-weight:600">재시험 후 점수</span> <input type="number" id="retake_dvocab" min="0" placeholder="재시험 점수" oninput="calcPct('dvocab')"><span style="font-size:11px;color:#889">/ <span id="retakemax_dvocab">40</span>점</span></div>
    </div>

    <div class="itembox">
      <div class="itemhd"><span class="nm"><i class="ti ti-checklist"></i>숙제 이행율 (태도)</span>
        <span class="mini"><span class="pctnow" id="pct_attitude">–</span></span></div>
      <div class="chklist" id="chkList"></div>
      <div class="addchk"><input type="text" id="newChk" placeholder="항목 추가 (예: 기타 과제)"><button onclick="addChk()">+ 추가</button></div>
      <div class="attsum" id="attSum"></div>
    </div>

    <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px">
      <button class="btn bgrn" onclick="saveEval()"><i class="ti ti-device-floppy"></i>이 회차 저장</button>
    </div>
    <div class="savedmsg" id="savedMsg"></div>
  </div>

  <div class="navrow" style="justify-content:flex-end">
    <button class="btn bprim" onclick="go(1)">성장 리포트 <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<!-- STEP 1: 성장 리포트 -->
<div id="s1" class="hidden">
  <div id="reportOut"></div>
  <div class="navrow" style="margin-top:12px">
    <button class="btn bsec" onclick="go(0)"><i class="ti ti-arrow-left"></i> 입력으로</button>
    <div style="display:flex;gap:8px">
      <button class="btn bsec" onclick="downloadImage()" style="background:#e3f4f0;border-color:#b6e0d7;color:#2ba89a"><i class="ti ti-photo-down"></i>이미지 저장 · 학부모 전송용</button>
      <button class="btn bsec" onclick="downloadPDF()" style="background:#fef0f0;border-color:#f0cccc;color:#c0392b"><i class="ti ti-file-type-pdf"></i>PDF 저장</button>
    </div>
  </div>
</div>

</div>

/* ===== Bridge-3 그룹2 — 입력 & 성장 리포트 ===== */

const g=id=>document.getElementById(id);
const val=id=>{const el=g(id);return el?el.value.trim():'';};

const G2_ITEMS={
  rvocab:{label:"리딩 단어시험",icon:"ti-book",color:"#22365a"},
  grammar:{label:"문법 Test",icon:"ti-pencil",color:"#7c3aed"},
  dvocab:{label:"Daily Vocab (능률보카/워드맥스)",icon:"ti-vocabulary",color:"#b8860b"},
  attitude:{label:"숙제 이행율",icon:"ti-checklist",color:"#2d7a4f"}
};
const G2_ORDER=["rvocab","grammar","dvocab","attitude"];
const RECENT_N=8;
const ATTITUDE_DEFAULT=["본문 녹음","워크북","Syntax"];

let curPct={rvocab:null,grammar:null,dvocab:null,attitude:null};
let curPass={rvocab:null,dvocab:null};   // 첫 시험 통과 여부(true/false/null)
let curFinal={rvocab:null,dvocab:null};  // 최종 점수%(재시험 반영)
const PASS_ITEMS=["rvocab","dvocab"];    // 통과/재시험 개념이 있는 항목
let chkItems=[]; // [{name, done}]

/* ===== 한국어 조사 ===== */
function hasJong(ch){const c=ch.charCodeAt(0);if(c<0xAC00||c>0xD7A3)return null;return (c-0xAC00)%28!==0;}
function withJosa(name,type){if(!name||!name.trim())return type==='eun'?'해당 학생은':'해당 학생을';const last=name.trim().slice(-1);const j=hasJong(last);if(j===null)return name+(type==='eun'?'는':'를');if(type==='eun')return j?name+'이는':name+'는';if(type==='eul')return j?name+'이를':name+'를';return name;}

/* ===== localStorage (Weekly 앱과 공유 키) ===== */
function LS(action,key,data){const PFX='b3_';if(action==='get')return JSON.parse(localStorage.getItem(PFX+key)||'null');if(action==='set')localStorage.setItem(PFX+key,JSON.stringify(data));}
function studentKey(){const n=val('stuName').replace(/\s/g,'');const s=val('stuSchool').replace(/\s/g,'');return n?`student_${s}_${n}`:null;}
function loadStudent(){const k=studentKey();if(!k)return null;return LS('get',k)||{group1:{weekly:[],worksheet:[],monthly:[]},group2:{rvocab:[],grammar:[],dvocab:[],attitude:[]}};}

/* ===== 정규화 ===== */
function pctOf(raw,max){return max>0?Math.round(raw/max*1000)/10:0;}

function calcPct(item){
  if(item==='grammar'){const r=parseFloat(val('raw_grammar'));curPct.grammar=isNaN(r)?null:Math.round(r*10)/10;}
  else{const r=parseFloat(val('raw_'+item)),m=parseFloat(val('max_'+item));curPct[item]=(isNaN(r)||isNaN(m)||m<=0)?null:pctOf(r,m);}
  const el=g('pct_'+item);if(el)el.textContent=curPct[item]==null?'–':curPct[item]+'%';
  if(PASS_ITEMS.includes(item))judgePass(item);
}

// 통과/재시험 판정 + 재시험 칸 토글 + 최종점수 계산
function judgePass(item){
  const raw=parseFloat(val('raw_'+item)), max=parseFloat(val('max_'+item)), cut=parseFloat(val('cut_'+item));
  const prow=g('passrow_'+item), rrow=g('retakerow_'+item), rmax=g('retakemax_'+item);
  if(rmax&&!isNaN(max))rmax.textContent=max;
  // 점수·만점·컷이 다 있어야 판정
  if(isNaN(raw)||isNaN(max)||isNaN(cut)||max<=0){
    if(prow)prow.innerHTML=''; if(rrow)rrow.style.display='none';
    curPass[item]=null; curFinal[item]=curPct[item]; return;
  }
  const passed = raw>=cut;
  curPass[item]=passed;
  if(passed){
    if(prow)prow.innerHTML=`<span class="badge pass"><i class="ti ti-circle-check"></i> 한 번에 통과</span>`;
    if(rrow)rrow.style.display='none';
    curFinal[item]=curPct[item];               // 최종=첫점수
  }else{
    if(prow)prow.innerHTML=`<span class="badge retake"><i class="ti ti-refresh"></i> 재시험 대상 (컷 ${cut}점 미달)</span>`;
    if(rrow)rrow.style.display='flex';
    // 재시험 점수가 입력됐으면 최종=재시험%, 아니면 일단 첫점수
    const rt=parseFloat(val('retake_'+item));
    curFinal[item]= isNaN(rt)? curPct[item] : pctOf(rt,max);
  }
}

/* ===== 태도 체크리스트 (가변) ===== */
function renderChk(){
  const box=g('chkList');if(!box)return;
  box.innerHTML=chkItems.map((c,i)=>`<div class="chkrow"><input type="checkbox" ${c.done?'checked':''} onchange="toggleChk(${i})"><span class="cname">${c.name}</span><button class="del" onclick="delChk(${i})" title="삭제">×</button></div>`).join('');
  updateAttitude();
}
function toggleChk(i){chkItems[i].done=!chkItems[i].done;updateAttitude();}
function delChk(i){chkItems.splice(i,1);renderChk();}
function addChk(){const v=val('newChk');if(!v)return;chkItems.push({name:v,done:false});g('newChk').value='';renderChk();}
function updateAttitude(){
  const total=chkItems.length,done=chkItems.filter(c=>c.done).length;
  curPct.attitude=total>0?pctOf(done,total):null;
  if(g('pct_attitude'))g('pct_attitude').textContent=curPct.attitude==null?'–':curPct.attitude+'%';
  if(g('attSum'))g('attSum').textContent=total>0?`이행 ${done} / 전체 ${total} = ${curPct.attitude}%`:'';
}

/* ===== 저장 ===== */
function saveEval(){
  const k=studentKey();
  if(!k){showSaved('학생 이름과 학교를 먼저 입력하세요.',true);return;}
  const date=val('evalDate')||new Date().toISOString().slice(0,10);
  const entered=G2_ORDER.filter(it=>curPct[it]!=null);
  if(!entered.length){showSaved('입력된 항목이 없습니다.',true);return;}
  const st=loadStudent();
  entered.forEach(it=>{
    st.group2[it]=st.group2[it]||[];
    // 같은 날짜 같은 항목이 있으면 갱신, 없으면 추가
    const ix=st.group2[it].findIndex(e=>e.date===date);
    const rec={date,pct:curPct[it]};
    if(it==='attitude')rec.detail=chkItems.map(c=>({name:c.name,done:c.done}));
    if(PASS_ITEMS.includes(it)){
      const cut=parseFloat(val('cut_'+it));
      if(!isNaN(cut))rec.cut=cut;
      if(curPass[it]!=null)rec.passed=curPass[it];
      rec.finalPct = curFinal[it]!=null ? curFinal[it] : curPct[it];
    }
    if(ix>=0)st.group2[it][ix]=rec;else st.group2[it].push(rec);
    st.group2[it].sort((a,b)=>a.date<b.date?-1:1);
  });
  LS('set',k,st);
  showSaved(`${val('stuName')} 학생 · ${date} · ${entered.length}개 항목 저장 완료.`,false);
}
function showSaved(msg,err){const e=g('savedMsg');if(!e)return;e.style.display='block';e.style.color=err?'#c0392b':'#2d7a4f';e.textContent=msg;}

/* ===== 학생 변경 시 힌트 ===== */
function onStuChange(){
  const st=loadStudent();const hint=g('stuHint');if(!hint)return;
  if(!st){hint.style.display='none';return;}
  const counts=G2_ORDER.map(it=>`${G2_ITEMS[it].label.split(' ')[0]} ${(st.group2[it]||[]).length}회`).join(' · ');
  const hasData=G2_ORDER.some(it=>(st.group2[it]||[]).length);
  if(hasData){hint.style.display='block';hint.innerHTML=`<b>${val('stuName')}</b> 누적 기록: ${counts}`;}
  else hint.style.display='none';
  // 직전 통과컷·만점 기억 (통과 항목)
  PASS_ITEMS.forEach(it=>{
    const arr=st.group2[it]||[];
    for(let i=arr.length-1;i>=0;i--){
      if(arr[i].cut!=null){const c=g('cut_'+it);if(c&&!c.value)c.value=arr[i].cut;break;}
    }
  });
}

/* ===== 추이·차트 공통 함수 (검증 완료분) ===== */
function trend(series){
  if(!series.length)return null;
  const pcts=series.map(s=>s.pct);
  const latest=pcts[pcts.length-1];
  const avg=Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length*10)/10;
  let dir="flat",delta=0;
  if(pcts.length>=2){
    const h=Math.ceil(pcts.length/2);
    const recent=pcts.slice(-h),prev=pcts.slice(0,pcts.length-h);
    if(prev.length){
      const ra=recent.reduce((a,b)=>a+b,0)/recent.length;
      const pa=prev.reduce((a,b)=>a+b,0)/prev.length;
      delta=Math.round((ra-pa)*10)/10;
      dir=delta>=3?"up":delta<=-3?"down":"flat";
    }
  }
  return {latest,avg,dir,delta,count:series.length};
}
function monthlyAvg(series,field){
  const f=field||'pct';
  const b={};series.forEach(s=>{const ym=s.date.slice(0,7);const v=s[f]!=null?s[f]:s.pct;(b[ym]=b[ym]||[]).push(v);});
  return Object.keys(b).sort().map(ym=>({ym,pct:Math.round(b[ym].reduce((a,x)=>a+x,0)/b[ym].length*10)/10,n:b[ym].length}));
}
// 통과/재시험 집계 (rvocab·dvocab용)
function passStats(series){
  const withPass=series.filter(s=>s.passed!=null);
  if(!withPass.length)return null;
  const first=series.map(s=>s.pct);
  const final=series.map(s=>s.finalPct!=null?s.finalPct:s.pct);
  const firstAvg=Math.round(first.reduce((a,b)=>a+b,0)/first.length*10)/10;
  const finalAvg=Math.round(final.reduce((a,b)=>a+b,0)/final.length*10)/10;
  const total=withPass.length;
  const once=withPass.filter(s=>s.passed).length;
  return {firstAvg,finalAvg,total,once,retake:total-once,oncePassRate:Math.round(once/total*1000)/10};
}
function lineChart(monthly,w,h,color){
  if(!monthly.length)return '<text x="10" y="20" font-size="11" fill="#999">데이터 없음</text>';
  const padL=30,padR=14,padT=14,padB=22,innerW=w-padL-padR,innerH=h-padT-padB;
  const xs=monthly.length>1?monthly.map((m,i)=>padL+i*innerW/(monthly.length-1)):[padL+innerW/2];
  const y=pct=>padT+(100-pct)/100*innerH;
  let grid='';[0,50,100].forEach(gv=>{const gy=y(gv);grid+=`<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#e6e9f2" stroke-width="1"/><text x="${padL-5}" y="${gy+3}" font-size="8" fill="#aab" text-anchor="end">${gv}</text>`;});
  const pts=monthly.map((m,i)=>`${xs[i].toFixed(1)},${y(m.pct).toFixed(1)}`).join(' ');
  let dots='';monthly.forEach((m,i)=>{const cx=xs[i],cy=y(m.pct);dots+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" fill="${color}"/><text x="${cx.toFixed(1)}" y="${(cy-7).toFixed(1)}" font-size="8.5" fill="${color}" text-anchor="middle" font-weight="700">${m.pct}</text><text x="${cx.toFixed(1)}" y="${h-7}" font-size="8" fill="#889" text-anchor="middle">${parseInt(m.ym.slice(5))}월</text>`;});
  const line=monthly.length>1?`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`:'';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${grid}${line}${dots}</svg>`;
}
const DIR_LABEL={up:"상승세",down:"하락세",flat:"유지"};
const DIR_CLS={up:"up",down:"down",flat:"flat"};

/* ===== 네비게이션 ===== */
function go(step){
  ['s0','s1'].forEach((id,i)=>{const el=g(id);if(el)el.classList.toggle('hidden',i!==step);});
  document.querySelectorAll('.sbtn').forEach((b,i)=>b.classList.toggle('active',i===step));
  if(step===1)buildGrowthReport();
  window.scrollTo(0,0);
}

/* ===== 성장 리포트 ===== */
function buildGrowthReport(){
  const st=loadStudent();const nm=val('stuName')||'이름 없음';const sc=val('stuSchool')||'';
  if(!st||!G2_ORDER.some(it=>(st.group2[it]||[]).length)){
    g('reportOut').innerHTML='<div class="card" style="text-align:center;color:#889;padding:40px">저장된 평가 기록이 없습니다.<br>먼저 수업 평가를 입력·저장해주세요.</div>';return;
  }
  let charts='';
  G2_ORDER.forEach(it=>{
    const series=st.group2[it]||[];if(!series.length)return;
    const meta=G2_ITEMS[it];
    const isPass=PASS_ITEMS.includes(it);
    const ps=isPass?passStats(series):null;
    // 통과 항목은 최종점수(finalPct) 기준, 그 외는 pct 기준
    const field=isPass?'finalPct':'pct';
    const t=trend(series.map(s=>({date:s.date,pct:(isPass&&s.finalPct!=null)?s.finalPct:s.pct})));
    const m=monthlyAvg(series,field);
    const recent=series.slice(-RECENT_N);
    const recordChips=recent.map(r=>{
      if(isPass&&r.passed!=null){
        const tag=r.passed?'<span style="color:#2d7a4f">✓</span>':'<span style="color:#c0392b">재</span>';
        const fp=(r.finalPct!=null&&r.finalPct!==r.pct)?`→${r.finalPct}%`:'';
        return `<span class="rc">${r.date.slice(5)} ${r.pct}%${fp} ${tag}</span>`;
      }
      return `<span class="rc">${r.date.slice(5)} ${r.pct}%</span>`;
    }).join('');
    // 통계 라인
    let statLine;
    if(ps){
      statLine=`첫시험 평균 <b>${ps.firstAvg}%</b> · 최종 평균 <b>${ps.finalAvg}%</b> · <span class="trendtag ${DIR_CLS[t.dir]}">${DIR_LABEL[t.dir]}${t.dir!=='flat'?(t.delta>0?' +'+t.delta:' '+t.delta):''}</span>`;
    }else{
      statLine=`최근 <b>${t.latest}%</b> · 누적평균 <b>${t.avg}%</b> · <span class="trendtag ${DIR_CLS[t.dir]}">${DIR_LABEL[t.dir]}${t.dir!=='flat'?(t.delta>0?' +'+t.delta:' '+t.delta):''}</span>`;
    }
    // 통과율 배지(통과 항목만)
    const passBadge=ps?`<div style="margin-top:7px;display:flex;gap:8px;flex-wrap:wrap"><span style="font-size:11px;font-weight:700;background:#eaf6ee;color:#2d7a4f;border-radius:10px;padding:3px 11px">한 번에 통과율 ${ps.oncePassRate}%</span><span style="font-size:11px;font-weight:700;background:${ps.retake>0?'#fdeaea':'#eef2fb'};color:${ps.retake>0?'#c0392b':'#3f5a85'};border-radius:10px;padding:3px 11px">재시험 ${ps.retake}회 / 총 ${ps.total}회</span></div>`:'';
    const chartLabel=isPass?`${meta.label} <span style="font-size:9px;color:#99a;font-weight:600">(최종 점수 추이)</span>`:meta.label;
    charts+=`<div class="gchart"><div class="gh"><span class="gname"><i class="ti ${meta.icon}" style="color:${meta.color}"></i>${chartLabel}</span><span class="gstat">${statLine}</span></div>${lineChart(m,440,130,meta.color)}${passBadge}<div class="recordlist">${recordChips}</div></div>`;
  });
  // 종합 코멘트 (객관 수치 기반)
  const comment=growthComment(st,nm);
  const html=`<div style="background:#fff;border:1px solid #e4e8f1;border-radius:16px;padding:26px;max-width:760px;margin:0 auto">
    <div style="background:linear-gradient(135deg,#16243e,#3f5a85);color:#fff;border-radius:12px;padding:20px 24px;margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div style="font-size:10px;opacity:.75;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px">파머스국제어학원 광교브랜치</div><div style="font-size:19px;font-weight:800">${nm} — 성장 리포트</div><div style="font-size:11.5px;opacity:.82;margin-top:4px">${sc} · 리딩단어 · 문법 · Daily Vocab · 태도</div></div>
        <img src="${LOGO_LIGHT}" alt="PAMUS" style="height:26px;width:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))">
      </div>
    </div>
    ${charts}
    ${comment?`<div style="background:#eef2fb;border-radius:10px;padding:14px 18px;margin-top:14px;border-left:3px solid #3f5a85"><div style="font-size:11px;font-weight:700;color:#22365a;margin-bottom:6px">▶ 종합 코멘트</div><div style="font-size:12px;line-height:1.85;color:#445">${comment}</div></div>`:''}
    <div style="border-top:1px solid #e8ebf3;padding-top:12px;margin-top:14px;text-align:center;font-size:10px;color:#bbc">파머스국제어학원 광교브랜치 · The Class Bridge-3 · 월 단위 평균 추이</div>
  </div>`;
  g('reportOut').innerHTML=html;
}

function growthComment(st,nm){
  const ups=[],downs=[],highs=[];
  G2_ORDER.forEach(it=>{const s=st.group2[it]||[];if(s.length<2)return;const t=trend(s);if(t.dir==='up')ups.push(G2_ITEMS[it].label);if(t.dir==='down')downs.push(G2_ITEMS[it].label);if(t.avg>=85)highs.push(G2_ITEMS[it].label);});
  let c=`${withJosa(nm,'eun')} `;const parts=[];
  if(ups.length)parts.push(`${ups.join(', ')}에서 상승 추이를 보이고 있습니다`);
  if(highs.length)parts.push(`${highs.join(', ')}은(는) 누적 평균 85% 이상으로 안정적입니다`);
  if(downs.length)parts.push(`${downs.join(', ')}은(는) 최근 추이를 함께 점검할 필요가 있습니다`);
  if(!parts.length)return `${withJosa(nm,'eun')} 회차별 데이터가 누적되고 있으며, 추이는 다음 회차부터 더 선명해집니다.`;
  return c+parts.join('. ')+'.';
}

/* ===== 다운로드 ===== */
function fileBaseName(){const nm=val('stuName')||'학생';return [nm,'Bridge3','성장리포트'].join('_');}
function downloadImage(){const el=g('reportOut');if(!el||!el.innerHTML.trim()||el.innerText.includes('저장된 평가 기록이 없습니다')){alert('먼저 평가를 입력·저장해주세요.');return;}if(typeof html2canvas==='undefined'){alert('이미지 라이브러리 로드 실패. 잠시 후 다시 시도해주세요.');return;}html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(c=>{const l=document.createElement('a');l.download=fileBaseName()+'.png';l.href=c.toDataURL('image/png');l.click();}).catch(()=>alert('이미지 저장 오류.'));}
function downloadPDF(){const el=g('reportOut');if(!el||!el.innerHTML.trim()||el.innerText.includes('저장된 평가 기록이 없습니다')){alert('먼저 평가를 입력·저장해주세요.');return;}if(typeof html2canvas==='undefined'||!window.jspdf){alert('PDF 라이브러리 로드 실패. 잠시 후 다시 시도해주세요.');return;}const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;width:800px;background:#fff';const cl=el.cloneNode(true);cl.style.padding='24px';wrap.appendChild(cl);document.body.appendChild(wrap);html2canvas(wrap,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(c=>{document.body.removeChild(wrap);const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const pw=210,ph=297,mg=8,aw=pw-mg*2,ah=ph-mg*2;let iw=aw,ih=c.height*iw/c.width;if(ih>ah){ih=ah;iw=c.width*ih/c.height;}pdf.addImage(c.toDataURL('image/png'),'PNG',(pw-iw)/2,mg,iw,ih);pdf.save(fileBaseName()+'.pdf');}).catch(()=>{if(wrap.parentNode)document.body.removeChild(wrap);alert('PDF 저장 오류.');});}

document.addEventListener('DOMContentLoaded',()=>{const al=g('appLogo');if(al)al.src=LOGO_DARK;g('evalDate').value=new Date().toISOString().slice(0,10);chkItems=ATTITUDE_DEFAULT.map(n=>({name:n,done:false}));renderChk();go(0);});
</script>
